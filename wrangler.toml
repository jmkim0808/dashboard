# Cloudflare Workers 배포 설정
#
# 최초 설정 순서 (EP8 W0)
#   1) npx wrangler login
#   2) npx wrangler d1 create powernet-esg     -> 출력된 database_id 를 아래에 붙여넣는다
#   3) npx wrangler r2 bucket create powernet-esg-evidence
#   4) npx wrangler deploy
#
# 의존성은 wrangler 하나뿐이다. 빌드 단계를 만들지 않는다. (EP8 원칙 2)

name = "powernet-esg"
main = "src/api.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "powernet-esg"
# 2026-10-01 생성. 비밀값이 아니다 — 이 ID 만으로는 접근할 수 없고 Cloudflare 계정 인증이 필요하다
database_id = "3c853e68-3c36-484a-80d7-79d4c9a267aa"

[[r2_buckets]]
binding = "EVIDENCE"
bucket_name = "powernet-esg-evidence"

[vars]
APP_NAME = "POWERNET ESG"
FACTOR_VERSION = "v2026.1"

# Cloudflare Access 통과를 강제한다. 이 파일에서는 항상 "true" 로 둔다.
# 테스트 배포(SETUP.md A-5)는 파일을 고치지 않고 배포 명령에서만 끈다:
#   wrangler deploy --var REQUIRE_ACCESS:false
# 이렇게 하면 다음에 그냥 deploy 하는 순간 자동으로 다시 켜진다. 되돌리는 걸 잊을 수 없다.
REQUIRE_ACCESS = "true"
